name: Quality gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux
          POSTGRES_DB: fluxinvoice
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flux -d fluxinvoice"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://flux:flux@localhost:5432/fluxinvoice
      TEST_DATABASE_URL: postgresql://flux:flux@localhost:5432/postgres
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-never-use-for-real-accounts-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: echo "JAVA_BIN=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run compliance:install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
