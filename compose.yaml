services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: fluxinvoice
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flux -d fluxinvoice']
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres:
